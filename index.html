<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#173b4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="智頭線の勾配・構造物・速度を確認する路線図ビューア">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>智頭線 路線図ビューア 第二試作</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>智頭線</strong><span id="modeTitle">路線図</span></div>
      <nav class="mode-tabs" aria-label="表示モード">
        <button class="mode-tab active" data-mode="route">路線</button>
        <button class="mode-tab" data-mode="speed">速度</button>
      </nav>
      <div class="top-actions">
        <button id="orientationBtn" class="icon-button" aria-label="縦横を切り替える" title="縦横切替">↻</button>
        <button id="menuBtn" class="icon-button" aria-label="表示設定を開く" title="表示設定">☰</button>
      </div>
    </header>

    <main class="main-stage">
      <section id="routeWorkspace" class="workspace" aria-label="路線図">
        <div class="status-pills"><button id="fitBtn" class="status-button">全体</button><span>1本指で縦横移動</span></div>
        <div id="railViewport" class="rail-viewport">
          <svg id="railSvg" role="img" aria-label="智頭線の連続路線図"></svg>
        </div>
        <div class="zoom-buttons" aria-label="拡大縮小">
          <button id="zoomInBtn" aria-label="拡大">＋</button>
          <button id="zoomOutBtn" aria-label="縮小">−</button>
        </div>
        <div id="gestureHint" class="gesture-hint">1本指で縦横へ　2本指で拡大・縮小</div>
      </section>

      <section id="speedWorkspace" class="workspace speed-workspace hidden" aria-label="速度モード">
        <div class="speed-tools">
          <strong>速度カーブ</strong>
          <div class="train-grid" aria-label="列車と方向">
            <div class="train-row"><span>7000</span><label class="line-toggle up"><input type="checkbox" data-speed="up" checked><span>上り</span></label><label class="line-toggle down"><input type="checkbox" data-speed="down"><span>下り</span></label></div>
            <div class="train-row unavailable"><span>列車②</span><button disabled>データ未登録</button></div>
            <div class="train-row unavailable"><span>列車③</span><button disabled>データ未登録</button></div>
          </div>
        </div>
        <div id="speedViewport" class="rail-viewport speed-viewport"><svg id="speedSvg" role="img" aria-label="7000の上り下り速度カーブ"></svg></div>
      </section>

      <section class="route-navigator" aria-label="全線の表示位置">
        <span class="navigator-end">0k</span>
        <input id="positionSlider" type="range" min="0" max="56.1" step="0.01" value="28.05" aria-label="表示する距離">
        <output id="positionOutput" for="positionSlider">28k050m</output>
      </section>

      <section id="infoBar" class="info-bar" aria-live="polite">
        <button id="infoClose" class="info-close hidden" aria-label="詳細を閉じる">×</button>
        <div class="info-main"><strong id="infoName">全線表示</strong><span id="infoKm">0k000m — 56k100m</span></div>
        <div class="info-detail"><span id="infoType">駅・トンネルを表示中</span><span id="infoRelation">設備をタップすると詳しく表示します</span></div>
      </section>
    </main>

    <aside id="settings" class="settings" aria-label="表示設定" aria-hidden="true">
      <div class="settings-head"><div><strong>表示設定</strong><span>各項目を 自動／表示／非表示</span></div><button id="menuClose" class="icon-button dark" aria-label="設定を閉じる">×</button></div>
      <div id="layerSettings" class="layer-settings"></div>
      <button id="resetLayers" class="reset-button">すべて自動に戻す</button>
      <div class="browser-note">動作基準：Chrome／Edge／iPhone Safari</div>
    </aside>
    <button id="scrim" class="scrim hidden" aria-label="設定を閉じる"></button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="route-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
